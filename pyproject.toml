[project]
name = "zero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyobjc-framework-carbon>=12.1",
    "pyobjc-framework-cocoa>=12.1",
    "pyobjc-framework-quartz>=12.1",
    "pyobjc-framework-webkit>=12.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "langgraph>=0.0.10",
    "langchain-ollama>=0.0.1",
    "langchain-core>=0.1.10",
    "pydantic>=2.12.5",
    "keyring>=24.0.0",
    "notion-client>=2.2.1",
    "PyGithub>=2.1.1",
    "langchain-openai>=1.1.7",
    "mem0ai>=0.0.20",
    "qdrant-client>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
