<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div id="app">
        <div id="header">
            <div id="context-badge" class="hidden">

                <span id="context-text">Desktop</span>
            </div>
        </div>
        <div id="chat-container"></div>
        <div id="input-area">
            <span class="prompt-char">&gt;</span>
            <input type="text" id="user-input" placeholder="Command or Ask..." autocomplete="off" autocorrect="off"
                autocapitalize="off" spellcheck="false" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
