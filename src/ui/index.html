<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="chat-container">
            <div class="message system">
                <span class="icon">Z</span>
                <p>Zero initialized. Waiting for input...</p>
            </div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask Zero..." autocomplete="off" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
