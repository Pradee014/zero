<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
    <div id="app">
        <div id="header">
            <div id="context-app-name">Desktop</div>
            <div id="header-right">
                <div id="controls">
                    <div id="settings-btn" class="icon-btn" title="Settings">⚙️</div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h3>API Keys & Tools</h3>
                <p class="modal-desc">Keys are stored securely in your macOS Keychain.</p>

                <div class="input-group">
                    <label>Notion Integration Token</label>
                    <input type="password" id="key-notion" placeholder="secret_...">
                </div>

                <div class="input-group">
                    <label>Trello API Key</label>
                    <input type="password" id="key-trello" placeholder="Valid API Key">
                </div>

                <div class="input-group">
                    <label>GitHub Personal Access Token</label>
                    <input type="password" id="key-github" placeholder="ghp_...">
                </div>

                <div class="modal-actions">
                    <button id="cancel-settings" class="btn secondary">Cancel</button>
                    <button id="save-settings" class="btn primary">Save Securely</button>
                </div>
            </div>
        </div>

        <div id="chat-container"></div>
        <div id="input-area">
            <span class="prompt-char">&gt;</span>
            <input type="text" id="user-input" placeholder="Just ask... (e.g. 'Draft email to Bob')" autocomplete="off"
                autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
